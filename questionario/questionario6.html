<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
		<title>Questionário 6 - Múltipla Escolha</title>

		<link rel="stylesheet" href="styleTxt.css">

	</head>

	<body>
	
	<h2>Questionário 06</h2>

		<div id="quiz"></div>
		<button id="submit">Finalizar</button>
		<div id="results"></div>
		<script>
		var myQuestions = [
	{
		
		question: "1- O que é hardware?",
		answers: {
			a: ' Programas utilizados para realizar tarefas específicas em um computador.<br>',
			b: ' A parte física de um computador, como componentes e dispositivos.<br>',
			c: ' Um tipo de rede local.<br>',
			d: ' Um sistema operacional.'

		},
		correctAnswer: 'b'
	},
	{		
		question: "2- Qual dos itens abaixo é considerado um hardware de armazenamento?",
		answers: {
			a: ' Impressora.<br>',
			b: ' Memória RAM.<br>',
			c: ' Disco Rígido (HD).<br>',
			d: ' Teclado.'

		},
		correctAnswer: 'c'
	},
	{		
		question: "3- O que é software?",
		answers: {
			a: ' A parte física de um computador.<br>',
			b: ' Um programa ou conjunto de instruções que orienta o hardware a realizar tarefas específicas.<br>',
			c: ' Qualquer dispositivo externo conectado ao computador.<br>',
			d: ' Um sistema para conectar redes locais.'

		},
		correctAnswer: 'b'
	},
	{
		question: "4- Qual dos itens abaixo é um exemplo de hardware de saída?",
		answers: {
			a: ' Mouse<br>',
			b: ' Teclado<br>',
			c: ' Monitor<br>',
			d: ' Pen Drive'
		},
		correctAnswer: 'c'
	},
	{		
		question: "5- Qual é a diferença principal entre hardware e software?",
		answers: {
			a: ' Hardware é físico e palpável, enquanto software é intangível e consiste em programas.<br>',
			b: ' Software é a parte física, enquanto hardware são os programas.<br>',
			c: ' Ambos são apenas partes físicas do computador.<br>',
			d: ' Não existe diferença, pois ambos têm a mesma função.'
		},
		correctAnswer: 'b'
	},
	{		
		question: "6- Qual é um exemplo de software de sistema?",
		answers: {
			a: ' Google Chrome.<br>',
			b: ' Microsoft Word.<br>',
			c: ' Windows 10.<br>',
			d: ' Impressora HP.'
		},
		correctAnswer: 'c'
	},
	{		
		question: "7- Qual dos dispositivos abaixo é um exemplo de hardware de entrada?",
		answers: {
			a: ' Monitor.<br>',
			b: ' Scanner.<br>',
			c: ' Placa-mãe.<br>',
			d: ' Caixa de som.'
		},
		correctAnswer: 'b'
	},
	{		
		question: "8- O que é firmware?",
		answers: {
			a: ' Um dispositivo de entrada conectado ao computador.<br>',
			b: ' Uma memória externa conectada ao hardware.<br>',
			c: ' Um sistema operacional usado em computadores de grande porte.<br>',
			d: ' Um software armazenado em um hardware que controla suas funções básicas.',

		},
		correctAnswer: 'd'
	},
	{		
		question: "9- Qual dos itens a seguir é um exemplo de software de aplicação?",
		answers: {
			a: ' Memória RAM.<br>',
			b: ' Microsoft Excel.<br>',
			c: ' Sistema Operacional Linux.<br>',
			d: ' Processador Intel Core i5.'

		},
		correctAnswer: 'b'
	},
	{		
		question: "10- O que é necessário para o funcionamento de um computador?",
		answers: {
			a: ' Apenas hardware.<br>',
			b: ' Apenas software.<br>',
			c: ' Hardware e software, funcionando de forma integrada.<br>',
			d: ' Apenas um sistema operacional.'
		},
		correctAnswer: 'c'
	},
	
];

var quizContainer = document.getElementById('quiz');
var resultsContainer = document.getElementById('results');
var submitButton = document.getElementById('submit');

generateQuiz(myQuestions, quizContainer, resultsContainer, submitButton);

function generateQuiz(questions, quizContainer, resultsContainer, submitButton){

	function showQuestions(questions, quizContainer){
		// precisaremos de um lugar para armazenar a saída e as opções de resposta
		var output = [];
		var answers; // poderia ter dado outro nome, alem do mais, eu mesmo me confundi :/

		// para cada questão
		for(var i=0; i<questions.length; i++){
			
			// mas, primeiro resetamos a lista de questões
			answers = [];

			// e aqui faremos para cada resposta na questão.
			for(letter in questions[i].answers){

				// Aqui será escrito para html para usar o Radio.
				answers.push(
					'<label>'
						+ '<input type="radio" name="question'+i+'" value="'+letter+'">'
					//	+ letter + ') ' vou deixar a letra comentada, porque achei melhor assim
						+ questions[i].answers[letter]
					+ '</label>'
				);
			}

			// add this question and its answers to the output
			output.push(
				'<div class="question">' + questions[i].question + '</div>'
				+ '<div class="answers">' + answers.join('') + '</div>'
			);
		}

		// finally combine our output list into one string of html and put it on the page
		quizContainer.innerHTML = output.join('');
	}


	function showResults(questions, quizContainer, resultsContainer){
			
		
		var answerContainers = quizContainer.querySelectorAll('.answers');
		
		
		var userAnswer = '';
		var numCorrect = 0;
		
		
		for(var i=0; i<questions.length; i++){

			// agora ele vai virar a letra que esta marcada.
			userAnswer = (answerContainers[i].querySelector('input[name=question'+i+']:checked')||{}).value;
			
			
			
			if(userAnswer===questions[i].correctAnswer){
				
				numCorrect++;
				
				
				answerContainers[i].style.color = 'lightgreen';
			}
			
			else{
				
				answerContainers[i].style.color = 'red';
			}
		}

			
			resultsContainer.innerHTML = numCorrect + ' de ' + questions.length;
		}

	// show questions right away
	showQuestions(questions, quizContainer);

	// on submit, show results
	
	submitButton.onclick = function(){
		showResults(questions, quizContainer, resultsContainer);
		
	}
	
}

		</script>

	</body>

</html>
