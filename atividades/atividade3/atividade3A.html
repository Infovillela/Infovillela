<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Atividade 05 - Múltipla Escolha</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

.container {
    max-width: 700px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

img {
    max-width: 100%;
    height: auto;
    margin-bottom: 15px;
}

.opcoes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.opcoes button {
    padding: 15px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 8px;
    border: none;
    background-color: #e0e0e0;
}

.opcoes button:hover {
    background-color: #cfd8dc;
}

.status {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 18px;
}

.error-message {
    color: red;
    font-size: 18px;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

    <!-- STATUS -->
    <div class="status">
        <div>⭐ Pontos: <span id="pontos">0</span></div>
        <div>⏱ Tempo: <span id="tempo">15</span>s</div>
    </div>

    <!-- IMAGEM -->
    <img id="imagemEnigma" src="A1.jpg">

    <!-- PERGUNTA -->
    <h2 id="pergunta"></h2>

    <!-- OPÇÕES -->
    <div class="opcoes" id="opcoes"></div>

    <p id="erro" class="error-message"></p>

</div>

<script>
const TEMPO_MAX = 15;

const enigmas = [
    {
        imagem: "A1.jpg",
        pergunta: "Como chamamos o conjunto de peças físicas do computador?",
        opcoes: ["SOFTWARE", "HARDWARE", "INTERNET", "PROGRAMA"],
        correta: "HARDWARE"
    },
    {
        imagem: "A2.jpg",
        pergunta: "Qual equipamento exibe as imagens do computador?",
        opcoes: ["TECLADO", "MONITOR", "MOUSE", "CAIXA DE SOM"],
        correta: "MONITOR"
    },
    {
        imagem: "A3.jpg",
        pergunta: "Qual dispositivo usamos para movimentar o cursor?",
        opcoes: ["TECLADO", "MOUSE", "MONITOR", "IMPRESSORA"],
        correta: "MOUSE"
    },
    {
        imagem: "A4.jpg",
        pergunta: "Qual equipamento usamos para digitar textos?",
        opcoes: ["MOUSE", "TECLADO", "MONITOR", "PEN DRIVE"],
        correta: "TECLADO"
    }
];

let indiceAtual = 0;
let pontos = 0;
let acertos = 0;
let tempo = TEMPO_MAX;
let cronometro;

const imagem = document.getElementById("imagemEnigma");
const pergunta = document.getElementById("pergunta");
const opcoesDiv = document.getElementById("opcoes");
const erro = document.getElementById("erro");
const pontosSpan = document.getElementById("pontos");
const tempoSpan = document.getElementById("tempo");

function iniciarTempo() {
    tempo = TEMPO_MAX;
    tempoSpan.innerText = tempo;

    cronometro = setInterval(() => {
        tempo--;
        tempoSpan.innerText = tempo;

        if (tempo <= 0) {
            clearInterval(cronometro);
            erro.innerText = "⏰ Tempo esgotado!";
            proximaPergunta();
        }
    }, 1000);
}

function carregarEnigma() {
    const enigma = enigmas[indiceAtual];

    imagem.src = enigma.imagem;
    pergunta.innerText = enigma.pergunta;
    erro.innerText = "";
    opcoesDiv.innerHTML = "";

    iniciarTempo();

    enigma.opcoes.forEach(opcao => {
        const botao = document.createElement("button");
        botao.innerText = opcao;
        botao.onclick = () => verificarResposta(opcao);
        opcoesDiv.appendChild(botao);
    });
}

function verificarResposta(resposta) {
    clearInterval(cronometro);

    if (resposta === enigmas[indiceAtual].correta) {
        pontos += 10;
        acertos++;
        pontosSpan.innerText = pontos;
    } else {
        erro.innerText = "❌ Resposta incorreta!";
    }

    setTimeout(proximaPergunta, 800);
}

function proximaPergunta() {
    indiceAtual++;

    if (indiceAtual >= enigmas.length) {
        mostrarResultadoFinal();
        return;
    }

    carregarEnigma();
}

function mostrarResultadoFinal() {
    imagem.style.display = "none";
    opcoesDiv.innerHTML = "";
    pergunta.innerHTML = `
        <h2>🏁 Resultado Final</h2>
        <p>✔ Acertos: ${acertos} de ${enigmas.length}</p>
        <p>⭐ Pontuação final: ${pontos} pontos</p>
    `;
    tempoSpan.innerText = "0";
}

carregarEnigma();
</script>

</body>
</html>
